# Whole system: docker compose up --build   (requires .env; copy .env.example)
name: recon

x-java-env: &java-env
  SERVER_PORT: 8081
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  STORAGE_TYPE: s3
  STORAGE_S3_ENDPOINT: http://localstack:4566
  STORAGE_S3_BUCKET: ${S3_BUCKET:?copy .env.example to .env}
  STORAGE_S3_REGION: ${AWS_REGION:?copy .env.example to .env}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      # KRaft single node: this process is both broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:?copy .env.example to .env}
      S3_BUCKET: ${S3_BUCKET:?copy .env.example to .env}
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway-sim:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE: gateway-sim
    image: recon/gateway-sim:local
    environment:
      <<: *java-env
      BANK_SIM_URL: http://bank-sim:8082
      JAVA_OPTS: "-Xmx768m -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8081:8081"
    depends_on:
      kafka: { condition: service_healthy }
      localstack: { condition: service_healthy }
      bank-sim: { condition: service_healthy }
    healthcheck: &java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  bank-sim:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE: bank-sim
    image: recon/bank-sim:local
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      JAVA_OPTS: "-Xmx1g -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8082:8082"
    depends_on:
      localstack: { condition: service_healthy }
    healthcheck: *java-health

  recon-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE: recon-service
    image: recon/recon-service:local
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:?copy .env.example to .env}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:?copy .env.example to .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?copy .env.example to .env}
      GATEWAY_SIM_URL: http://gateway-sim:8081
      BANK_SOAP_URL: http://bank-sim:8082/ws
      JAVA_OPTS: "-Xmx1536m -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      localstack: { condition: service_healthy }
    healthcheck: *java-health

  web:
    build:
      context: ./web
    image: recon/web:local
    ports:
      - "3000:80"
    depends_on:
      recon-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
