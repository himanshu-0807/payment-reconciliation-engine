apiVersion: v1
kind: Service
metadata:
  name: gateway-sim
spec:
  selector: { app: gateway-sim }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-sim
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway-sim }
  template:
    metadata:
      labels: { app: gateway-sim }
    spec:
      containers:
        - name: gateway-sim
          image: recon/gateway-sim:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: recon-config }
            - secretRef: { name: recon-secrets }
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: JAVA_OPTS, value: "-Xmx768m -XX:+ExitOnOutOfMemoryError" }

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
