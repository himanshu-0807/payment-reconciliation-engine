apiVersion: v1
kind: Service
metadata:
  name: recon-service
spec:
  selector: { app: recon-service }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: recon-service }
  template:
    metadata:
      labels: { app: recon-service }
    spec:
      containers:
        - name: recon-service
          image: recon/recon-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: recon-config }
            - secretRef: { name: recon-secrets }
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: JAVA_OPTS, value: "-Xmx1536m -XX:+ExitOnOutOfMemoryError" }
            - { name: DB_PORT, value: "5432" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
