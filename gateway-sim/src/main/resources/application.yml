server:
  port: 8081

spring:
  application:
    name: gateway-sim
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      batch-size: 262144
      compression-type: lz4
      properties:
        linger.ms: 20
        enable.idempotence: true

sim:
  bank-sim-url: ${BANK_SIM_URL:http://localhost:8082}

storage:
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:4566}
    region: ${STORAGE_S3_REGION:ap-south-1}
    bucket: ${STORAGE_S3_BUCKET:recon-data}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  local:
    root: ${STORAGE_LOCAL_ROOT:./data/object-store}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
