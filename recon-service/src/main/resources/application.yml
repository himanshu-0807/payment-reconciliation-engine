server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: recon-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:recon}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER:recon}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:24}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: recon-ledger
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 2000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        linger.ms: 20
    listener:
      type: batch
      ack-mode: batch

storage:
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:4566}
    region: ${STORAGE_S3_REGION:ap-south-1}
    bucket: ${STORAGE_S3_BUCKET:recon-data}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  local:
    root: ${STORAGE_LOCAL_ROOT:./data/object-store}

recon:
  parallelism: ${RECON_PARALLELISM:4}
  tolerance-minor: 100
  approval-threshold-minor: 50
  settlement-days: 2
  grace-days: 5
  fallback-window-days: 7
  gateway-sim-url: ${GATEWAY_SIM_URL:http://localhost:8081}
  bank-soap-url: ${BANK_SOAP_URL:http://localhost:8082/ws}
  ledger:
    consumer-concurrency: ${LEDGER_CONSUMER_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m%n"
